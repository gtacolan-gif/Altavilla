<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scegli la lingua · Choose your language</title>
  <style>
    /* ▼ FONT MILESTONE: metti il file del font nella stessa cartella e controlla il nome qui sotto ▼ */
    @font-face {
      font-family: "Milestone One";
      src: local("Milestone One"), local("MilestoneOne"),
           url("MilestoneOne.woff2") format("woff2"),
           url("MilestoneOne.ttf") format("truetype"),
           url("MilestoneOne.otf") format("opentype");
      font-display: swap;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { height: 100%; }

    /* Altezza della barra superiore (usata anche per far partire lo sfondo sotto di essa) */
    :root {
      --barra: 88px;
      /* ▼▼▼ CAMBIA QUI il nome/percorso della tua immagine di sfondo ▼▼▼ */
      --sfondo: url("Sfondo.png");
      /* Colore di riserva: viene sostituito in automatico dal colore della parte bassa dell'immagine (vedi script in fondo) */
      --colore-fondo: #7a6a58;
    }

    /* Questo colore riempie tutto lo schermo, anche sotto la barra del browser del telefono */
    html { background-color: var(--colore-fondo); }

    /* Immagine di sfondo: parte SOTTO la barra e in basso sfuma nel suo stesso colore */
    body::before {
      content: "";
      position: fixed;
      top: var(--barra);
      left: 0;
      right: 0;
      bottom: 0;
      z-index: -1;
      background:
        linear-gradient(to bottom, transparent calc(100% - 180px), var(--colore-fondo) 100%),
        var(--sfondo) center / cover no-repeat;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: calc(var(--barra) + 32px) 24px 24px;
    }

    /* ===== BARRA SUPERIORE ===== */
    .barra {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      height: var(--barra);
      padding: 0 20px;
      background: rgba(245, 235, 208, 0.75); /* crema, 0.75 = 25% di trasparenza */
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      box-shadow: 0 2px 14px rgba(0, 0, 0, 0.2);
    }

    .barra img {
      height: 78px;   /* ◄ altezza del logo (allungato di 10px sull'asse y) */
      width: 68px;    /* ◄ larghezza del logo */
      display: block;
    }

    .barra h1 {
      font-family: "Milestone One", "Milestone", Georgia, "Times New Roman", serif;
      font-size: 2.8rem;
      font-weight: normal;
      letter-spacing: 0.03em;
      line-height: 1.1;
      color: #582612; /* marrone del logo */
    }

    @media (max-width: 480px) {
      :root { --barra: 64px; }
      .barra { gap: 10px; padding: 0 12px; }
      .barra img { height: 54px; width: 44px; }
      .barra h1 { font-size: 1.7rem; }
    }

    .riquadro {
      background: rgba(245, 235, 208, 0.75); /* crema, 0.75 = 25% di trasparenza (abbassa per più trasparenza) */
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border-radius: 14px;
      padding: 44px 56px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
    }

    .lingue {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .lingue a {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 14px 16px;
      border-radius: 8px;
      color: #1f2a30;
      text-decoration: none;
      font-size: 1.5rem;
      transition: background 0.2s;
    }

    .lingue a:hover,
    .lingue a:focus-visible {
      background: rgba(255, 255, 255, 0.9);
      outline: 2px solid #1f2a30;
      outline-offset: -2px;
    }

    .bandiera {
      flex: 0 0 auto;
      width: 36px;
      height: 24px;
      border-radius: 3px;
      overflow: hidden;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.2);
    }

    .bandiera svg { display: block; width: 100%; height: 100%; }

    @media (max-width: 480px) {
      .riquadro { padding: 28px 18px; }
      .lingue a { font-size: 1.3rem; }
    }
  </style>
</head>
<body>

  <header class="barra">
    <img src="Altavilla.png" alt="Logo Hotel Altavilla Roma">
    <h1>Hotel Altavilla</h1>
  </header>

  <main class="riquadro">
    <ul class="lingue">

      <!-- ITALIANO -->
      <li>
        <!-- ▼ Inserisci qui il link alla versione italiana ▼ -->
        <a href="LINK-ITALIANO.html" hreflang="it" lang="it">
          <span class="bandiera" aria-hidden="true">
            <svg viewBox="0 0 60 40" preserveAspectRatio="none">
              <rect width="20" height="40" fill="#009246"/>
              <rect x="20" width="20" height="40" fill="#fff"/>
              <rect x="40" width="20" height="40" fill="#CE2B37"/>
            </svg>
          </span>
          Italiano
        </a>
      </li>

      <!-- INGLESE -->
      <li>
        <!-- ▼ Inserisci qui il link alla versione inglese ▼ -->
        <a href="LINK-INGLESE.html" hreflang="en" lang="en">
          <span class="bandiera" aria-hidden="true">
            <svg viewBox="0 0 60 40" preserveAspectRatio="none">
              <rect width="60" height="40" fill="#012169"/>
              <path d="M0,0 L60,40 M60,0 L0,40" stroke="#fff" stroke-width="7"/>
              <path d="M0,0 L60,40 M60,0 L0,40" stroke="#C8102E" stroke-width="3"/>
              <path d="M30,0 V40 M0,20 H60" stroke="#fff" stroke-width="12"/>
              <path d="M30,0 V40 M0,20 H60" stroke="#C8102E" stroke-width="7"/>
            </svg>
          </span>
          English
        </a>
      </li>

      <!-- SPAGNOLO -->
      <li>
        <!-- ▼ Inserisci qui il link alla versione spagnola ▼ -->
        <a href="LINK-SPAGNOLO.html" hreflang="es" lang="es">
          <span class="bandiera" aria-hidden="true">
            <svg viewBox="0 0 60 40" preserveAspectRatio="none">
              <rect width="60" height="40" fill="#AA151B"/>
              <rect y="10" width="60" height="20" fill="#F1BF00"/>
            </svg>
          </span>
          Español
        </a>
      </li>

      <!-- FRANCESE -->
      <li>
        <!-- ▼ Inserisci qui il link alla versione francese ▼ -->
        <a href="LINK-FRANCESE.html" hreflang="fr" lang="fr">
          <span class="bandiera" aria-hidden="true">
            <svg viewBox="0 0 60 40" preserveAspectRatio="none">
              <rect width="20" height="40" fill="#002395"/>
              <rect x="20" width="20" height="40" fill="#fff"/>
              <rect x="40" width="20" height="40" fill="#ED2939"/>
            </svg>
          </span>
          Français
        </a>
      </li>

    </ul>
  </main>

  <script>
    /* Calcola il colore medio della parte bassa dell'immagine di sfondo, per sfumare il fondo della pagina */
    (function () {
      var m = getComputedStyle(document.documentElement).getPropertyValue('--sfondo').match(/url\(["']?(.*?)["']?\)/);
      if (!m) return;
      var img = new Image();
      img.onload = function () {
        try {
          var n = 8, c = document.createElement('canvas');
          c.width = c.height = n;
          var x = c.getContext('2d');
          x.drawImage(img, 0, img.height * 0.9, img.width, img.height * 0.1, 0, 0, n, n);
          var d = x.getImageData(0, 0, n, n).data, r = 0, g = 0, b = 0, k = n * n;
          for (var i = 0; i < d.length; i += 4) { r += d[i]; g += d[i + 1]; b += d[i + 2]; }
          document.documentElement.style.setProperty('--colore-fondo',
            'rgb(' + Math.round(r / k) + ',' + Math.round(g / k) + ',' + Math.round(b / k) + ')');
        } catch (e) { /* se l'immagine non è leggibile resta il colore di riserva */ }
      };
      img.src = m[1];
    })();
  </script>

</body>
</html>
